name: Watch BTC real-vs-paper freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-market-data-free
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check snapshot age
        id: freshness
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const snapshot = JSON.parse(fs.readFileSync("data/btc-market.json", "utf8"));
          const generatedAt = Date.parse(snapshot.generated_at);
          if (!Number.isFinite(generatedAt)) {
            throw new Error("data/btc-market.json generated_at is missing or invalid");
          }
          const ageMinutes = Math.floor((Date.now() - generatedAt) / 60000);
          const stale = ageMinutes >= 120;
          console.log(`generated_at=${snapshot.generated_at}`);
          console.log(`age_minutes=${ageMinutes}`);
          console.log(`stale=${stale}`);
          NODE

      - name: Dispatch updater when stale
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run btc-market-data.yml --ref main
