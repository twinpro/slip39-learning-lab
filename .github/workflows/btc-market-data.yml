name: Update BTC real-vs-paper data

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect BTC market data
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          MACROMICRO_TOKEN: ${{ secrets.MACROMICRO_TOKEN }}
          MACROMICRO_API_URL: ${{ secrets.MACROMICRO_API_URL }}
        run: node scripts/update-btc-market.mjs

      - name: Commit updated market JSON
        run: |
          git config user.name "btc-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/btc-market.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update BTC market data"
            git push
          fi
