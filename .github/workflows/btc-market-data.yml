name: Update BTC real-vs-paper data FREE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/btc-market-data.yml"
      - "scripts/btc-lib.mjs"
      - "scripts/btc-history-lib.mjs"
      - "scripts/update-btc-market.mjs"
      - "scripts/update-btc-history.mjs"
      - "scripts/btc-market-recovery-lib.mjs"
      - "scripts/check-btc-market-recovery.mjs"
      - "scripts/verify-btc-market-freshness.mjs"
      - "scripts/verify-snapshot.mjs"
      - "scripts/verify-history.mjs"
      - "scripts/test-collector.mjs"
      - "scripts/test-history.mjs"
      - "scripts/test-btc-market-recovery.mjs"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-market-data-free
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Capture pre-run market timestamp
        run: |
          node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync('data/btc-market.json','utf8')); if(!Date.parse(d.generated_at)) throw new Error('invalid pre-run generated_at'); fs.appendFileSync(process.env.GITHUB_ENV, 'BTC_MARKET_BEFORE_GENERATED_AT='+d.generated_at+'\n');"

      - name: Run collector safety tests
        run: node scripts/test-collector.mjs

      - name: Run history safety tests
        run: node scripts/test-history.mjs

      - name: Run recovery gate tests
        run: node scripts/test-btc-market-recovery.mjs

      - name: Collect free public BTC market data
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
        run: node scripts/update-btc-market.mjs

      - name: Verify fresh collection advanced timestamp
        run: node scripts/verify-btc-market-freshness.mjs after-collect

      - name: Print compact source health
        run: node scripts/report-health.mjs

      - name: Verify generated snapshot before publish
        id: snapshot_verify
        continue-on-error: true
        run: node scripts/verify-snapshot.mjs

      - name: Write source-health status for this attempt
        run: node scripts/write-health-status.mjs

      - name: Update hourly verified history
        if: steps.snapshot_verify.outcome == 'success'
        run: node scripts/update-btc-history.mjs

      - name: Verify history before publish
        if: steps.snapshot_verify.outcome == 'success'
        run: node scripts/verify-history.mjs

      - name: Restore rejected market snapshot
        if: steps.snapshot_verify.outcome != 'success'
        run: git restore data/btc-market.json

      - name: Commit updated market JSON
        run: |
          git config user.name "btc-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/btc-market.json data/btc-market-history.jsonl data/btc-market-health.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update BTC market data"
            git push
          fi

      - name: Verify changed data was committed and pushed
        run: node scripts/verify-btc-market-freshness.mjs after-commit

      - name: Fail workflow after preserving rejected-attempt health
        if: steps.snapshot_verify.outcome != 'success'
        run: exit 1
