name: Update Bitcoin monthly returns

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-monthly-returns
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Coin Metrics PriceUSD and calculate returns
        run: node scripts/update-btc-monthly-returns.mjs
      - name: Validate monthly returns
        run: node --test scripts/test-monthly-returns-live.mjs components/btc-monthly-returns/monthly-returns.test.mjs
      - name: Commit changed monthly-return data only
        run: |
          if git diff --quiet -- data/btc-monthly-returns.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btc-monthly-returns.json
          git commit -m "data: update Bitcoin monthly returns"
          git push
