name: Watch BTC real-vs-paper freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: btc-market-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deduplicate recovery and prolonged outage alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/watch-btc-market.mjs
