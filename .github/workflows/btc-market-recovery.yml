name: Recover BTC real-vs-paper data

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: btc-market-writer
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check collection cadence
        id: cadence
        run: node scripts/check-btc-collection-due.mjs
      - name: Run collector safety tests
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/test-collector.mjs
      - name: Run history safety tests
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/test-history.mjs
      - name: Run recovery gate tests
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/test-btc-market-recovery.mjs
      - name: Run pipeline fault tests
        if: steps.cadence.outputs.due == 'true'
        run: node --test tests/btc-pipeline.test.mjs
      - name: Collect, validate and stage verified data
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/publish-btc-market.mjs
      - name: Print compact source health
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/report-health.mjs
      - name: Commit and verify remote publication
        if: steps.cadence.outputs.due == 'true'
        run: node scripts/commit-btc-market.mjs
