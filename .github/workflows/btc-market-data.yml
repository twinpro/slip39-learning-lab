name: Update BTC real-vs-paper data FREE

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/btc-market-*.yml'
      - 'scripts/btc-*.mjs'
      - 'scripts/*btc-market*.mjs'
      - 'scripts/check-btc-collection-due.mjs'
      - 'scripts/test-collector.mjs'
      - 'scripts/test-history.mjs'
      - 'tests/btc-pipeline*.mjs'
      - 'scripts/verify-snapshot.mjs'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/btc-market-recovery.yml
    secrets: inherit
